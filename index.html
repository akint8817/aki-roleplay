<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memories of Past — Codex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Anton&display=swap');

:root{
  --bg: #08080a;
  --surface: #121214;
  --surface-2: #1a1a1c;
  --border: #2c2a24;
  --text: #cfcac0;
  --text-dim: #756f60;
  --amber: #c4c9d1;
  --amber-dim: #4b5158;
  --verdigris: #8a95a6;
  --danger: #7a3a34;
  --radius: 2px;
}

*{ box-sizing: border-box; margin:0; padding:0; }

body{
  background: var(--bg);
  color: var(--text);
  font-family: 'EB Garamond', serif;
  font-size: 16px;
  min-height: 100vh;
  position: relative;
  background-image:
    radial-gradient(ellipse at 15% -10%, rgba(196,201,209,0.05), transparent 45%),
    radial-gradient(ellipse at 88% 8%, rgba(138,149,166,0.045), transparent 40%),
    radial-gradient(ellipse at 50% 110%, rgba(196,201,209,0.04), transparent 50%);
}

.lumens{
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.lumens span{
  position: absolute;
  bottom: -20px;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 6px 2px rgba(196,201,209,0.55);
  opacity: 0;
  animation: drift linear infinite;
}
.lumens span.ember{ background: var(--verdigris); box-shadow: 0 0 6px 2px rgba(138,149,166,0.5); }
.lumens span:nth-child(1){ left: 6%; animation-duration: 22s; animation-delay: 0s; }
.lumens span:nth-child(2){ left: 16%; animation-duration: 28s; animation-delay: 4s; }
.lumens span:nth-child(3){ left: 27%; animation-duration: 19s; animation-delay: 9s; }
.lumens span:nth-child(4){ left: 38%; animation-duration: 25s; animation-delay: 2s; }
.lumens span:nth-child(5){ left: 49%; animation-duration: 21s; animation-delay: 11s; }
.lumens span:nth-child(6){ left: 60%; animation-duration: 30s; animation-delay: 6s; }
.lumens span:nth-child(7){ left: 71%; animation-duration: 23s; animation-delay: 14s; }
.lumens span:nth-child(8){ left: 81%; animation-duration: 26s; animation-delay: 1s; }
.lumens span:nth-child(9){ left: 91%; animation-duration: 20s; animation-delay: 8s; }
.lumens span:nth-child(10){ left: 50%; animation-duration: 24s; animation-delay: 16s; }
@keyframes drift{
  0%{ transform: translateY(0) translateX(0); opacity: 0; }
  10%{ opacity: 0.9; }
  50%{ transform: translateY(-52vh) translateX(8px); }
  90%{ opacity: 0.4; }
  100%{ transform: translateY(-100vh) translateX(-6px); opacity: 0; }
}

.shell{ position: relative; z-index: 1; padding-bottom: 58px; }

.music-bar{
  position: fixed; left:0; right:0; bottom:0;
  z-index: 500;
  display:flex; align-items:center; gap:14px;
  height: 58px;
  padding: 0 18px;
  background: rgba(9,9,10,0.96);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(6px);
}
.music-play{
  flex-shrink:0;
  width:34px; height:34px;
  border-radius:50%;
  border:1px solid var(--amber-dim);
  background: transparent;
  color: var(--amber);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition: box-shadow .2s, border-color .2s;
}
.music-play:hover{ border-color: var(--amber); box-shadow: 0 0 10px rgba(196,201,209,0.35); }
.music-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; justify-content:center; }
.music-title{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.04em;
  color: var(--amber);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.music-progress-wrap{
  height:4px; border-radius:2px; background: var(--surface-2);
  cursor:pointer; position:relative; overflow:hidden;
}
.music-progress-fill{ height:100%; width:0%; background: var(--amber); }
.music-time{
  flex-shrink:0;
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--text-dim);
}
.music-volume{ flex-shrink:0; display:flex; align-items:center; gap:6px; color: var(--text-dim); }
.music-volume input[type="range"]{
  width: 70px; accent-color: var(--amber);
}
@media (max-width: 700px){
  .music-bar{ gap:10px; padding:0 12px; }
  .music-time{ display:none; }
  .music-volume{ display:none; }
}

/* --- connexion (haut droite) et espace d'écriture --- */
.auth-dock{ position:fixed; top:16px; right:16px; z-index:900; }
.auth-btn{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
  background: rgba(10,10,12,0.8); border:1px solid var(--amber-dim); color: var(--amber);
  padding:7px 14px; border-radius: var(--radius); cursor:pointer;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.auth-btn:hover{ border-color: var(--amber); box-shadow: 0 0 10px rgba(196,201,209,0.3); }
.auth-panel{
  position:absolute; top:calc(100% + 8px); right:0; width:230px;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding:14px; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  opacity:0; transform:translateY(-6px); pointer-events:none;
  transition: opacity .18s ease, transform .18s ease;
}
.auth-panel.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
.auth-row{ margin-bottom:10px; }
.auth-row label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color: var(--text-dim); margin-bottom:4px; }
.auth-row input{
  width:100%; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  padding:7px 9px; border-radius: var(--radius); font-family:'IBM Plex Mono', monospace; font-size:12px; outline:none;
}
.auth-row input:focus{ border-color: var(--amber-dim); }
.auth-error{ color:#e0857c; font-size:11px; margin-bottom:8px; min-height:14px; }
.auth-welcome{ font-size:12.5px; color: var(--text-dim); margin-bottom:10px; }
.auth-welcome strong{ color: var(--amber); }
.auth-submit{ display:block; width:100%; text-align:center; margin-bottom:8px; }
.auth-submit:last-child{ margin-bottom:0; }

.write-form{
  border:1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  padding:20px; max-width:560px;
}
.write-row{ margin-bottom:14px; }
.write-row label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color: var(--text-dim); margin-bottom:5px; }
.write-row input, .write-row select, .write-row textarea{
  width:100%; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  padding:9px 11px; border-radius: var(--radius); font-family:'EB Garamond', serif; font-size:13.5px; outline:none;
  resize:vertical;
}
.write-row input:focus, .write-row select:focus, .write-row textarea:focus{ border-color: var(--amber-dim); }
.write-error{ color:#e0857c; font-size:12px; margin-bottom:10px; min-height:16px; }
.write-hint{ font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.5; }
.write-hint code{ background:var(--surface-2); border:1px solid var(--border); border-radius:2px; padding:0 4px; font-family:'IBM Plex Mono',monospace; }
.write-images-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.write-image-item{
  display:flex; align-items:center; gap:10px;
  border:1px solid var(--border); border-radius: var(--radius); background: var(--surface-2);
  padding:8px;
}
.write-image-item img{ width:64px; height:64px; object-fit:cover; border-radius: var(--radius); flex-shrink:0; }
.write-image-item .write-image-caption{ flex:1; margin:0; }
.write-image-item .btn{ flex-shrink:0; }

.auth-btn-avatar{ width:16px; height:16px; border-radius:50%; object-fit:cover; margin-right:6px; vertical-align:-3px; }

.account-section{
  border:1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  padding:20px; max-width:560px; margin-bottom:24px;
}
.account-section-title{ font-size:14px; color: var(--verdigris); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:14px; }
.avatar-row{ display:flex; align-items:center; gap:18px; }
.avatar-preview{
  width:64px; height:64px; border-radius:50%; overflow:hidden; flex-shrink:0;
  background: var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel', serif; font-size:24px; color: var(--text-dim);
}
.avatar-preview img{ width:100%; height:100%; object-fit:cover; }
.avatar-actions{ display:flex; flex-direction:column; gap:8px; }
.avatar-upload-btn{ cursor:pointer; text-align:center; }
.account-list{ display:flex; flex-direction:column; gap:8px; }
.account-list-row{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:10px 12px; border:1px solid var(--border); border-radius: var(--radius); background: var(--surface-2);
  font-size:13.5px;
}
.custom-page-body{ max-width:70ch; }
.custom-page-body p{ font-size:14px; line-height:1.8; color: var(--text); margin-bottom:12px; }
.custom-page-body h3{ font-size:15px; margin: 20px 0 8px; color: var(--verdigris); text-transform:uppercase; letter-spacing:0.06em; font-family:'EB Garamond'; font-style:italic; font-weight:600; }
.custom-page-body h3:first-child{ margin-top:0; }

.intro-overlay{
  position: fixed; inset:0;
  z-index: 999;
  background: #050506;
  display:flex; align-items:center; justify-content:center;
  transition: opacity 0.9s ease;
  pointer-events: none; /* l'intro est purement décorative : ne jamais bloquer les clics dessous */
}
.intro-overlay.intro-hidden{ opacity: 0; }
#introCanvas{ display:block; width:100%; height:100%; }

h1,h2,h3,h4{
  font-family: 'Cinzel', serif;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: #e6ecf2;
}

::selection{ background: var(--amber-dim); color: #fff; }

/* --- layout shell --- */
.shell{
  display: grid;
  grid-template-columns: 280px 1fr;
  max-width: 1760px;
  margin: 0 auto;
  min-height: 100vh;
  transition: grid-template-columns .4s cubic-bezier(.2,.8,.2,1), max-width .4s ease;
}
.shell.immersive{ grid-template-columns: 0px 1fr; max-width: none; }
.shell.no-anim, .shell.no-anim .sidebar{ transition: none !important; }
@media (max-width: 800px){
  .shell{ grid-template-columns: 1fr; }
  .sidebar{ position: relative; }
}

/* --- sidebar --- */
.sidebar{
  border-right: 1px solid var(--border);
  padding: 28px 20px;
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  opacity: 1;
  transition: opacity .3s ease, padding .4s ease;
}
.shell.immersive .sidebar{ opacity: 0; padding-left:0; padding-right:0; pointer-events: none; border-right-color: transparent; }
@media (max-width: 800px){ .sidebar{ height: auto; position: static; border-right:none; border-bottom:1px solid var(--border);} }

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom: 26px;
  cursor:pointer;
}
.brand-mark{
  width: 30px; height:30px;
  border: 1px solid var(--amber);
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  color: var(--amber);
  font-family: 'Cinzel', serif;
  font-size: 17px;
  flex-shrink:0;
  box-shadow: 0 0 8px rgba(196,201,209,0.4);
  animation: markpulse 3.5s ease-in-out infinite;
}
@keyframes markpulse{
  0%,100%{ box-shadow: 0 0 6px rgba(196,201,209,0.3); }
  50%{ box-shadow: 0 0 13px rgba(196,201,209,0.6); }
}
.brand-name{
  font-family:'Cinzel', serif;
  font-size: 14px;
  font-weight:700;
  letter-spacing: 0.06em;
  line-height: 1.35;
  color:#e6ecf2;
}
.brand-sub{
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top:-4px;
}

.search-box{
  position: relative;
  margin-bottom: 24px;
}
.search-box input{
  width:100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px 9px 30px;
  border-radius: var(--radius);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  outline:none;
}
.search-box input:focus{ border-color: var(--amber-dim); }
.search-box svg{ position:absolute; left:9px; top:9px; opacity:0.5; width:14px; height:14px; }
.search-results{
  position:absolute;
  top: 40px; left:0; right:0;
  background: var(--surface-2);
  border:1px solid var(--border);
  border-radius: var(--radius);
  max-height: 260px;
  overflow-y:auto;
  z-index: 20;
  display:none;
}
.search-results.active{ display:block; }
.search-results a{
  display:block;
  padding: 8px 12px;
  font-size: 12.5px;
  color: var(--text);
  text-decoration:none;
  border-bottom: 1px solid var(--border);
}
.search-results a:last-child{ border-bottom:none; }
.search-results a:hover{ background: var(--surface); color: var(--amber); }
.search-results .cat-tag{ color: var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; margin-left:6px;}

.nav-group{ margin-bottom: 22px; }
.nav-label{
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
  padding-left: 2px;
}
.nav-link{
  display:flex;
  align-items:center;
  gap:10px;
  padding: 7px 8px;
  border-radius: var(--radius);
  color: var(--text);
  text-decoration:none;
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor:pointer;
  border-left: 2px solid transparent;
}
.nav-link:hover{ background: var(--surface); }
.nav-link.active{ color: var(--amber); border-left-color: var(--amber); background: var(--surface); }
.nav-icon{ width:15px; height:15px; opacity:0.75; flex-shrink:0; }

.sidebar-foot{
  margin-top: 30px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  line-height:1.6;
}

/* --- main --- */
.main{ padding: 0; }
.topbar{
  display:none;
}
.content{ padding: 34px 40px 60px; }
@media (max-width: 800px){ .content{ padding: 24px 20px 50px; } }
.content.page-enter{ animation: contentFadeIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes contentFadeIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

.crumbs{
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 14px;
}
.crumbs span{ color: var(--amber); }

/* --- hero (home) — cinematic opening --- */
.hero{
  border: 1px solid var(--border);
  background:
    radial-gradient(ellipse at 50% -10%, rgba(196,201,209,0.10), transparent 55%),
    linear-gradient(180deg, #0c0c0e 0%, #141416 55%, #0c0c0e 100%);
  border-radius: var(--radius);
  padding: 76px 40px 54px;
  margin: -34px -40px 34px;
  position: relative;
  overflow:hidden;
  text-align: center;
  display:flex; flex-direction:column; align-items:center;
}
@media (max-width: 800px){ .hero{ margin: -24px -20px 28px; padding: 56px 24px 40px; } }
.hero::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(196,201,209,0.16), transparent 50%),
    radial-gradient(circle at 12% 100%, rgba(138,149,166,0.07), transparent 45%),
    radial-gradient(circle at 90% 100%, rgba(196,201,209,0.06), transparent 45%);
  pointer-events:none;
}
.hero::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:120px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.5));
  pointer-events:none;
}
.hero-eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--verdigris);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin-bottom: 18px;
  position: relative; z-index:1;
}
.hero-sigil{
  width: 46px; height:46px;
  margin-bottom: 18px;
  position: relative; z-index:1;
  opacity: 0.85;
}
.hero h1{
  font-size: clamp(40px, 7vw, 76px);
  line-height: 1.05;
  margin-bottom: 16px;
  letter-spacing: 0.03em;
  color: #f2ede0;
  text-shadow: 0 0 30px rgba(196,201,209,0.35), 0 0 70px rgba(196,201,209,0.15);
  position: relative; z-index:1;
}
.hero-divider{
  width: 120px; height:1px;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  margin: 4px 0 20px;
  position: relative; z-index:1;
}
.hero p{ color: var(--text-dim); max-width: 56ch; font-size: 14.5px; line-height:1.75; position:relative; z-index:1; }
.hero-actions{ margin-top: 26px; display:flex; gap: 12px; flex-wrap:wrap; justify-content:center; position:relative; z-index:1; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 12.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-decoration:none;
  cursor:pointer;
  border: 1px solid var(--border);
  font-family:'IBM Plex Mono',monospace;
  position: relative;
}
.btn::before, .btn::after{ content:""; position:absolute; width:8px; height:8px; pointer-events:none; opacity:0.9; }
.btn::before{ top:-1px; left:-1px; border-top:1px solid currentColor; border-left:1px solid currentColor; }
.btn::after{ bottom:-1px; right:-1px; border-bottom:1px solid currentColor; border-right:1px solid currentColor; }
.btn-primary{ background: var(--amber-dim); border-color: var(--amber); color:#f5ecd8; transition: box-shadow .2s, background .2s; }
.btn-primary:hover{ background: var(--amber-dim); box-shadow: 0 0 16px rgba(196,201,209,0.45); }
.btn-ghost{ color: var(--text); background:transparent; transition: border-color .2s, color .2s; }
.btn-ghost:hover{ border-color: var(--verdigris); color: var(--verdigris); }

.map-box{
  position: relative;
  height: 460px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: #0c0d10;
}
@media (max-width: 700px){ .map-box{ height: 320px; } }
.map-canvas-wrap{ position:absolute; inset:0; overflow:hidden; perspective: 1400px; }
.map-world{ position:absolute; top:0; left:0; will-change:transform; transform-style: preserve-3d; }
.map-painted-canvas{ display:block; position:absolute; top:0; left:0; }
.map-relief-canvas{ display:block; position:absolute; top:0; left:0; pointer-events:none; transform: translateZ(70px); }
.map-pin2d{
  position:absolute;
  transform: translate(-50%,-100%);
  display:flex; flex-direction:column; align-items:center;
  gap:8px;
  cursor:pointer;
  pointer-events:auto;
  z-index: 4;
}
.map-pin2d .badge{
  width:46px; height:46px;
  border-radius:50%;
  background: radial-gradient(circle at 50% 32%, rgba(var(--gclr),0.28), #0a0a0c 70%);
  border:1.5px solid rgba(var(--gclr),0.8);
  box-shadow: 0 0 14px rgba(var(--gclr),0.5), inset 0 0 10px rgba(0,0,0,0.6);
  display:flex; align-items:center; justify-content:center;
  color: rgba(var(--gclr),0.95);
  transition: transform .2s ease, box-shadow .2s ease;
}
.map-pin2d .badge svg{ width:22px; height:22px; }
.map-pin2d:hover .badge{ transform: scale(1.12); box-shadow: 0 0 22px rgba(var(--gclr),0.8), inset 0 0 10px rgba(0,0,0,0.6); }
.map-pin2d .lbl{
  font-family:'Cinzel', serif;
  font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  color:#f0ebdc;
  text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.85);
  white-space:nowrap;
}
.map-toolbar{
  position:absolute; top:14px; left:14px; z-index:7;
  display:flex; gap:8px;
  pointer-events:auto;
}
.map-toolbar-btn{
  width:38px; height:38px; border-radius:50%;
  background: rgba(9,9,10,0.75);
  border:1px solid var(--amber-dim);
  color: var(--amber);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition: box-shadow .2s ease, border-color .2s ease;
}
.map-toolbar-btn:hover{ box-shadow: 0 0 12px rgba(196,201,209,0.4); }
.map-toolbar-btn svg{ width:16px; height:16px; }
.map-box.focused .map-vignette{ box-shadow: inset 0 0 150px rgba(0,0,0,0.85); transition: box-shadow .5s ease; }
.map-vignette{ transition: box-shadow .5s ease; }
.map-tiltshift{
  position:absolute; left:0; right:0;
  pointer-events:none;
  z-index: 2;
}
.map-tiltshift.top{
  top:0; height:34%;
  backdrop-filter: blur(3px);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
}
.map-tiltshift.bottom{
  bottom:0; height:34%;
  backdrop-filter: blur(3px);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}
.map-vignette{
  position:absolute; inset:0; pointer-events:none; z-index:2;
  box-shadow: inset 0 0 90px rgba(0,0,0,0.65);
}
.map-labels{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3; }

.map-tooltip{
  position:absolute; top:0; left:0;
  z-index: 5;
  pointer-events:none;
  background: rgba(10,10,12,0.92);
  border: 1px solid var(--amber-dim);
  border-radius: var(--radius);
  padding: 8px 10px;
  min-width: 150px;
  opacity: 0; visibility:hidden;
  transition: opacity .15s;
}
.map-tooltip.visible{ opacity:1; visibility:visible; }
.map-tooltip-title{ font-family:'Cinzel', serif; font-size:12px; color: var(--amber); margin-bottom: 6px; }
.map-tooltip-chars{ display:flex; gap:6px; flex-wrap:wrap; }
.map-tooltip-chip{
  display:flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%;
  background: var(--surface-2); border:1px solid var(--border);
  font-family:'Cinzel', serif; font-size:10px; color: var(--text);
}
.map-tooltip-empty{ font-size:10.5px; color: var(--text-dim); }

.map-panel{
  position:absolute; top:0; right:0; bottom:0;
  width: 300px; max-width: 82%;
  z-index: 6;
  background: rgba(9,9,10,0.96);
  border-left: 1px solid var(--border);
  padding: 20px 18px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform .38s cubic-bezier(.2,.8,.2,1);
}
.map-panel.open{ transform: translateX(0); }
.map-panel-close{
  position:absolute; top:12px; right:12px;
  background:none; border:none; color: var(--text-dim);
  font-size:14px; cursor:pointer; padding:4px 8px;
}
.map-panel-close:hover{ color: var(--amber); }
.map-panel-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color: var(--verdigris); }
.map-panel-title{ font-family:'Cinzel', serif; font-size:22px; color:#f0ebdc; margin: 4px 0 14px; }
.map-panel-chars{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px; }
.map-panel-chip{
  display:flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  background: var(--surface-2); border:1px solid var(--amber-dim);
  font-family:'Cinzel', serif; font-size:13px; color: var(--amber);
  cursor:pointer;
}
.map-panel-facts{
  display:grid; grid-template-columns: 1fr 1fr;
  gap: 10px 14px;
  padding: 12px 0; margin-bottom:14px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.map-panel-fact-k{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.08em; color: var(--text-dim); }
.map-panel-fact-v{ font-size:12px; color: var(--text); margin-top:2px; }
.map-panel-desc{ font-size:12.5px; color: var(--text-dim); line-height:1.7; margin-bottom:16px; }
.map-panel-link{ font-size:12px; color: var(--amber); text-decoration:none; cursor:pointer; }
.map-panel-link:hover{ text-decoration:underline; }
.map-panel-back{
  display:inline-flex; align-items:center; gap:6px;
  background:none; border:1px solid var(--border);
  color: var(--text-dim);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:0.04em;
  padding: 8px 14px;
  cursor:pointer;
  transition: border-color .2s ease, color .2s ease;
}
.map-panel-back:hover{ border-color: var(--verdigris); color: var(--verdigris); }

/* ---- Carte plein écran (page dédiée avec couverture + exploration) ---- */
.map-overlay{
  position: fixed; inset:0; z-index: 5000;
  background: #050506;
  opacity:0; pointer-events:none;
  transition: opacity .4s ease;
}
.map-overlay.open{ opacity:1; pointer-events:auto; }

.map-ov-cover{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
  transition: opacity .6s ease, transform .6s ease;
}
.map-ov-cover.leaving{ opacity:0; transform: scale(1.06); pointer-events:none; }
.map-ov-cover-canvas-wrap{ position:absolute; inset:0; overflow:hidden; }
.map-ov-cover-canvas-wrap canvas{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit: cover;
  filter: blur(7px) brightness(0.42) saturate(0.9);
}
.map-ov-cover-scrim{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0.25), rgba(0,0,0,0.75) 75%),
    linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.75));
}
.map-ov-cover-content{
  position:relative; z-index:2;
  text-align:center;
  display:flex; flex-direction:column; align-items:center;
  padding: 0 24px;
  animation: mapCoverIn 1s ease both;
}
@keyframes mapCoverIn{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform:translateY(0); } }
.map-ov-eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px; letter-spacing: 0.32em; text-transform:uppercase;
  color: var(--verdigris);
  margin-bottom: 20px;
}
.map-ov-title{
  font-family:'Cinzel', serif;
  font-size: clamp(46px, 9vw, 108px);
  letter-spacing: 0.08em;
  color: #f4efe1;
  text-shadow: 0 0 40px rgba(196,201,209,0.4), 0 0 90px rgba(196,201,209,0.18);
  margin-bottom: 6px;
}
.map-ov-cover-content .hero-divider{ margin: 10px 0 30px; }
.map-ov-explore-btn{
  display:inline-flex; align-items:center; gap:10px;
  padding: 14px 34px;
  border: 1px solid var(--amber);
  background: var(--amber-dim);
  color:#f5ecd8;
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px; letter-spacing:0.18em; text-transform:uppercase;
  cursor:pointer;
  transition: box-shadow .25s ease, transform .2s ease;
}
.map-ov-explore-btn:hover{ box-shadow: 0 0 26px rgba(196,201,209,0.5); transform: translateY(-1px); }

.map-ov-close{
  position:absolute; top:22px; right:26px; z-index:20;
  width:40px; height:40px; border-radius:50%;
  background: rgba(9,9,10,0.7);
  border:1px solid var(--amber-dim);
  color: var(--amber);
  font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: box-shadow .2s ease, border-color .2s ease;
}
.map-ov-close:hover{ box-shadow: 0 0 14px rgba(196,201,209,0.4); }

.map-ov-explore{
  position:absolute; inset:0;
  opacity:0; pointer-events:none;
  transform: scale(1.02);
  transition: opacity .6s ease, transform .8s ease;
}
.map-ov-explore.active{ opacity:1; pointer-events:auto; transform: scale(1); }

.map-box-overlay{ position:absolute; inset:0; height:auto; border:none; border-radius:0; }

.map-pin2d{ transition: opacity .45s ease, transform .45s ease; }
.map-pin2d.pin-enter{ opacity:0; transform: translate(-50%,-100%) translateY(10px); }

.map-poi{
  position:absolute;
  transform: translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  cursor:pointer;
  pointer-events:none;
  opacity:0;
  transition: opacity .4s ease;
  z-index:4;
}
.map-poi.visible{ opacity:1; pointer-events:auto; }
.map-poi .poi-dot{
  width:11px; height:11px;
  background: var(--amber);
  border: 1px solid #f5ecd8;
  transform: rotate(45deg);
  box-shadow: 0 0 10px rgba(196,201,209,0.7);
  transition: transform .2s ease;
}
.map-poi:hover .poi-dot{ transform: rotate(45deg) scale(1.3); }
.map-poi .poi-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:#f0ebdc;
  text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.85);
  white-space:nowrap;
}

@media (max-width:700px){
  .map-ov-eyebrow{ letter-spacing:0.2em; }
  .map-ov-explore-btn{ padding:12px 26px; }
}

.map-pin{
  position:absolute;
  top:0; left:0;
  pointer-events:auto;
  background: rgba(26,30,37,0.85);
  border: 1px solid var(--amber-dim);
  color: var(--amber);
  padding: 4px 9px;
  border-radius: 3px;
  font-size: 11px;
  font-family:'IBM Plex Mono', monospace;
  white-space: nowrap;
  cursor: pointer;
  backdrop-filter: blur(2px);
  transition: background .15s, color .15s;
}
.map-pin:hover{ background: var(--amber-dim); color: #fff2e2; }
.map-pin::after{
  content:"";
  position:absolute; left:50%; bottom:-5px;
  width:6px; height:6px;
  background: inherit;
  border-right: 1px solid var(--amber-dim);
  border-bottom: 1px solid var(--amber-dim);
  transform: translateX(-50%) rotate(45deg);
}

/* ---- Archives Halcyon : dossiers secrets des artefacts Oxiriens ---- */
.dossier-header{
  border: 1px solid var(--border);
  background: linear-gradient(180deg, #100c0c 0%, #141212 60%, #100c0c 100%);
  padding: 30px 32px 26px;
  margin-bottom: 28px;
  position: relative;
}
.dossier-header-org{
  font-family:'IBM Plex Mono', monospace;
  font-size: 12.5px; letter-spacing: 0.3em; text-transform: uppercase;
  color: #b25a52;
  margin-bottom: 10px;
}
.dossier-header-title{ font-family:'Cinzel', serif; font-size: 36px; color:#f0ebdc; margin-bottom: 14px; }
.dossier-header-meta{
  display:flex; gap: 22px; flex-wrap:wrap;
  font-family:'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing:0.05em;
  color: var(--text-dim); text-transform: uppercase;
  padding-bottom: 16px; margin-bottom: 16px;
  border-bottom: 1px dashed var(--border);
}
.dossier-header-meta b{ color: #c46e64; }
.dossier-epigraph{
  font-family:'EB Garamond', serif; font-style: italic;
  font-size: 16.5px; line-height: 1.8; color: var(--text);
  border-left: 2px solid #6b2f2a; padding-left: 16px; margin: 0;
}
.dossier-epigraph cite{ display:block; margin-top: 8px; font-style: normal; font-size: 12.5px; color: var(--text-dim); }

.dossier-list{ display:flex; flex-direction:column; gap: 2px; margin-bottom: 30px; }
.dossier-row{
  position: relative;
  display:grid; grid-template-columns: 70px 52px 1fr 20px;
  align-items:center; gap: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 12px 16px;
  cursor:pointer;
  transition: border-color .15s ease, background .15s ease;
}
.dossier-row:hover{ border-color: var(--amber-dim); background: var(--surface-2); }
.dossier-row-num{
  font-family:'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing:0.08em;
  color: var(--text-dim); line-height:1.4; text-transform:uppercase;
}
.dossier-row-thumb{ width:52px; height:52px; overflow:hidden; border:1px solid var(--border); background:#0a0a0c; flex-shrink:0; }
.dossier-row-thumb img{ width:100%; height:100%; object-fit:cover; filter: saturate(0.75) brightness(0.85); }
.dossier-row-noimg{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color: var(--text-dim); font-size:16px; }
.dossier-row-name{ font-family:'Cinzel', serif; font-size: 17px; color:#f0ebdc; margin-bottom:6px; }
.dossier-row-tags{ display:flex; gap:8px; flex-wrap:wrap; }
.dossier-row-arrow{ color: var(--text-dim); font-size:14px; transition: transform .15s ease, color .15s ease; }
.dossier-row:hover .dossier-row-arrow{ color: var(--amber); transform: translateX(3px); }
.dossier-row.restricted{ border-color:#5a2320; }
.dossier-row.restricted .dossier-row-name{ color:#c46e64; }
.dossier-row.corrupted .dossier-row-name{
  animation: dossierGlitch 3.2s infinite steps(1);
}
@keyframes dossierGlitch{
  0%,92%,100%{ text-shadow:none; transform:translateX(0); }
  93%{ text-shadow: -2px 0 #ff4d4d, 2px 0 #4dd0ff; transform:translateX(1px); }
  95%{ text-shadow: 2px 0 #ff4d4d, -2px 0 #4dd0ff; transform:translateX(-1px); }
  97%{ text-shadow:none; transform:translateX(0); }
}

.dstamp{
  display:inline-flex; align-items:center;
  font-family:'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing:0.08em; text-transform:uppercase;
  padding: 3px 8px; border-radius: 2px;
  border: 1px solid var(--border); color: var(--text-dim);
}
.dstamp-crit{ color:#e0857c; border-color:#6b2f2a; background: rgba(107,47,42,0.15); }
.dstamp-high{ color:#d9a15c; border-color:#6b4f22; background: rgba(107,79,34,0.15); }
.dstamp-mid{ color: var(--verdigris); border-color: var(--verdigris); background: rgba(138,149,166,0.1); }
.dstamp-unknown{ color: var(--text-dim); border-color: var(--border); }
.dstamp-lost{ color:#e0857c; border-color:#6b2f2a; background: rgba(107,47,42,0.15); }
.dstamp-vanished{ color:#b899d9; border-color:#4d3a6b; background: rgba(77,58,107,0.15); }
.dstamp-active{ color:#8fd0a0; border-color:#2f6b3f; background: rgba(47,107,63,0.15); }
.dstamp-forbidden{ color:#f0ebdc; border-color:#8a1f1a; background: rgba(138,31,26,0.35); }

.dossier-file{
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 28px 30px 30px;
  animation: dossierFileIn .3s ease both;
}
.dossier-file::after{
  content:"";
  position:absolute; left:0; right:0; top:-40%;
  height:40%;
  background: linear-gradient(180deg, rgba(196,201,209,0.14), transparent);
  animation: dossierScan .7s ease-out forwards;
  pointer-events:none;
}
@keyframes dossierFileIn{ from{ opacity:0; transform: scale(0.97); } to{ opacity:1; transform: scale(1); } }
@keyframes dossierScan{ from{ top:-40%; } to{ top:110%; } }
.dossier-file > *{ opacity:0; animation: dossierRowReveal .45s ease forwards; }
.dossier-file > *:nth-child(1){ animation-delay: .06s; }
.dossier-file > *:nth-child(2){ animation-delay: .14s; }
.dossier-file > *:nth-child(3){ animation-delay: .22s; }
.dossier-file > *:nth-child(4){ animation-delay: .30s; }
@keyframes dossierRowReveal{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform: translateY(0); } }
.dossier-file-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
.dossier-file-num{ font-family:'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing:0.14em; color: var(--text-dim); text-transform:uppercase; }
.dstamp-big{
  font-family:'IBM Plex Mono', monospace; font-size: 13.5px; letter-spacing:0.14em; text-transform:uppercase;
  padding: 6px 14px; border: 2px solid currentColor; border-radius: 2px;
  transform: rotate(-4deg);
  opacity: 0.9;
}
.dossier-file-title{ font-family:'Cinzel', serif; font-size: 36px; color:#f0ebdc; margin-bottom: 22px; padding-bottom:18px; border-bottom:1px solid var(--border); }
.dossier-file-body{ display:grid; grid-template-columns: minmax(0,1fr) 240px; gap: 30px; }
@media (max-width: 760px){ .dossier-file-body{ grid-template-columns: 1fr; } }
.dossier-file-main h3{
  font-family:'IBM Plex Mono', monospace; font-size: 13.5px; letter-spacing:0.1em; text-transform:uppercase;
  color: var(--verdigris); margin: 24px 0 10px;
}
.dossier-file-main h3:first-child{ margin-top:0; }
.dossier-file-main p{ font-size: 15.5px; line-height: 1.8; color: var(--text); margin-bottom: 10px; }
.dossier-list-block{ list-style:none; margin: 4px 0 12px; padding:0; }
.dossier-list-block li{
  font-size: 15px; color: var(--text); padding: 6px 0 6px 18px; position:relative;
  border-bottom: 1px solid var(--border);
}
.dossier-list-block li::before{ content:"—"; position:absolute; left:0; color: var(--text-dim); }
.dossier-list-block li:last-child{ border-bottom:none; }
.dossier-quote{
  font-family:'EB Garamond', serif; font-style: italic; font-size: 17px;
  color: #e0857c; border-left: 2px solid #6b2f2a;
  padding: 4px 0 4px 16px; margin: 10px 0;
}
.locked-archive{
  margin: 14px 0; padding: 14px; border: 1px solid #5a2320;
  background: rgba(90,35,32,0.08); border-radius: var(--radius);
}
.locked-archive-head{
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.08em;
  text-transform:uppercase; color:#e0857c;
}
.locked-archive-form{ display:flex; gap:8px; }
.locked-archive-input{
  flex:1; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  padding:8px 10px; border-radius: var(--radius); font-family:'IBM Plex Mono', monospace; font-size:12.5px; outline:none;
}
.locked-archive-input:focus{ border-color: var(--amber-dim); }
.locked-archive-error{ color:#e0857c; font-size:11.5px; margin-top:6px; min-height:14px; }
.locked-archive-content{ display:none; margin-top:10px; }
.locked-archive.unlocked .locked-archive-form,
.locked-archive.unlocked .locked-archive-error{ display:none; }
.locked-archive.unlocked .locked-archive-icon{ filter: grayscale(0); }

@keyframes lockedShake{
  0%,100%{ transform: translateX(0); }
  20%{ transform: translateX(-6px); }
  40%{ transform: translateX(6px); }
  60%{ transform: translateX(-4px); }
  80%{ transform: translateX(4px); }
}
.locked-archive.shake{ animation: lockedShake .4s; }

@keyframes lockedGlitch{
  0%{ opacity:0; clip-path: inset(0 0 90% 0); transform: translate(0,0); }
  10%{ opacity:1; clip-path: inset(10% 0 60% 0); transform: translate(-3px,0); text-shadow: 2px 0 #e0857c, -2px 0 #3ec9c0; }
  20%{ clip-path: inset(40% 0 20% 0); transform: translate(3px,0); }
  30%{ clip-path: inset(5% 0 70% 0); transform: translate(-2px,0); text-shadow: -2px 0 #e0857c, 2px 0 #3ec9c0; }
  45%{ clip-path: inset(60% 0 5% 0); transform: translate(2px,0); }
  60%{ clip-path: inset(0 0 0 0); transform: translate(-1px,0); text-shadow: 1px 0 #e0857c, -1px 0 #3ec9c0; }
  80%{ transform: translate(1px,0); text-shadow: none; }
  100%{ opacity:1; clip-path: inset(0 0 0 0); transform: translate(0,0); text-shadow:none; }
}
.locked-archive.unlocking .locked-archive-content{
  display:block; animation: lockedGlitch .55s steps(2,end);
}
.locked-archive.unlocked .locked-archive-content{ display:block; }

.dossier-file-side{ display:flex; flex-direction:column; gap: 16px; }
.dossier-file-media{ border:1px solid var(--border); overflow:hidden; background:#0a0a0c; }
.dossier-file-media img{ width:100%; height:auto; display:block; filter: saturate(0.8) brightness(0.9); }
.dossier-file-media.dossier-file-noimg{
  height:140px; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.1em; color: var(--text-dim);
  background: repeating-linear-gradient(135deg, #0a0a0c, #0a0a0c 8px, #111113 8px, #111113 16px);
}
.dossier-infobox{ font-size: 13px; }
.dossier-infobox .ib-k{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; }

.classified-block{ margin-top: 22px; border: 1px solid #5a2320; background: rgba(90,35,32,0.08); }
.classified-bar{
  display:flex; align-items:center; gap:10px;
  padding: 12px 14px; cursor:pointer;
  font-family:'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:#e0857c;
  transition: background .15s ease;
}
.classified-bar:hover{ background: rgba(90,35,32,0.15); }
.classified-label{ flex:1; }
.classified-chevron{ transition: transform .25s ease; }
.classified-block.open .classified-chevron{ transform: rotate(180deg); }
.classified-content{
  max-height:0; overflow:hidden; opacity:0; filter: blur(3px);
  transition: max-height .5s ease, opacity .4s ease, filter .4s ease;
  padding: 0 16px;
}
.classified-content p, .classified-content .dossier-quote{ font-size: 14.5px; }
.classified-block.open .classified-content{ max-height: 900px; opacity:1; filter: blur(0); padding: 4px 16px 16px; }

.dossier-nav{
  display:flex; align-items:center; justify-content:space-between;
  margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border);
  font-family:'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing:0.05em; text-transform:uppercase;
  color: var(--text-dim);
}
.dossier-nav span[onclick]{ cursor:pointer; transition: color .15s ease; }
.dossier-nav span[onclick]:hover{ color: var(--amber); }

.dossier-gate{
  position: relative;
  overflow: hidden;
  border: 1px solid #5a2320;
  background: repeating-linear-gradient(135deg, #100c0c, #100c0c 10px, #140f0f 10px, #140f0f 20px);
  padding: 60px 30px; text-align:center;
  animation: dossierFileIn .3s ease both;
}
.dossier-gate-icon{ font-size: 34px; margin-bottom: 14px; }

@keyframes dossierGateShake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(7px); }
  60%{ transform:translateX(-5px); }
  80%{ transform:translateX(4px); }
}

/* ---- Glitch cyberpunk : joué à l'ouverture des archives et sur l'écran d'accès interdit ---- */
.cyber-glitch{ animation: cgJitter .6s steps(1,end) 1; }
@keyframes cgJitter{
  0%,100%{ transform:translate(0,0); filter:none; }
  4%{ transform:translate(-6px,2px); filter:hue-rotate(90deg) saturate(3); }
  8%{ transform:translate(5px,-2px); filter:hue-rotate(-60deg) contrast(2); }
  12%{ transform:translate(-3px,0); filter:none; }
  18%{ transform:translate(4px,1px); filter:saturate(4) brightness(1.4); }
  24%{ transform:translate(0,0); filter:none; }
  32%{ transform:translate(-8px,-1px); filter:hue-rotate(180deg); }
  38%{ transform:translate(0,0); filter:none; }
  48%{ transform:translate(6px,2px); filter:contrast(2.4) saturate(0); }
  55%{ transform:translate(0,0); filter:none; }
}
.cyber-glitch::after{
  content:"";
  position:absolute; inset:0; z-index:60; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,20,60,0.14) 0px, rgba(255,20,60,0.14) 2px, transparent 2px, transparent 5px),
    repeating-linear-gradient(90deg, rgba(40,220,255,0.08) 0px, transparent 1px, transparent 3px);
  mix-blend-mode: screen;
  opacity:0;
  animation: cgScan .6s steps(1,end) 1;
}
@keyframes cgScan{
  0%{opacity:0;} 5%{opacity:0.85;} 10%{opacity:0;} 20%{opacity:0.6;} 25%{opacity:0;}
  33%{opacity:0.5;} 39%{opacity:0;} 48%{opacity:0.7;} 54%{opacity:0;} 100%{opacity:0;}
}
/* variante continue : la page reste instable en permanence, pas juste à l'ouverture */
.cyber-glitch-ambient{ animation: cgJitter 4.5s steps(1,end) infinite; }
.cyber-glitch-ambient::after{ animation: cgScan 4.5s steps(1,end) infinite; }

.featured-card:hover{ border-color: var(--amber-dim); }
.featured-img{
  position:absolute; inset:0; z-index:0;
  width:100%; height:100%; object-fit:cover; object-position: top center;
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
}
.featured-card:hover .featured-img{ transform: scale(1.06); }
.featured-card::before{
  content:"";
  position:absolute; inset:0; z-index:1;
  background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.15) 55%, transparent 70%), radial-gradient(ellipse at 60% 20%, rgba(196,201,209,0.08), transparent 60%);
}
.featured-info{
  position:absolute; left:0; right:0; bottom:0; z-index:2;

}
.featured-icon-badge{
  width:34px; height:34px; border-radius:50%;

  background: rgba(10,10,12,0.75); border:1.5px solid var(--amber);
  color: var(--amber);
  box-shadow: 0 0 10px rgba(196,201,209,0.35);
}
.featured-icon-badge svg{ width:16px; height:16px; }
.featured-tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color: var(--amber); }
.featured-name{ font-family:'Cinzel', serif; font-size:16px; letter-spacing:0.02em; color:#f0ebdc; text-transform:uppercase; }
.featured-large .featured-name{ font-size:22px; }
.featured-large .featured-icon-badge{ width:42px; height:42px; }
.featured-large .featured-icon-badge svg{ width:20px; height:20px; }

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 36px;
}
.card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  cursor:pointer;
  transition: border-color .15s ease, transform .15s ease;
  display:flex; flex-direction:column; gap:8px;
}
.card:hover{ border-color: var(--amber-dim); transform: translateY(-1px); box-shadow: 0 0 18px rgba(196,201,209,0.14); }
.card::before, .card::after{ content:""; position:absolute; width:9px; height:9px; pointer-events:none; opacity:0; transition:opacity .2s ease; }
.card::before{ top:5px; left:5px; border-top:1px solid var(--amber); border-left:1px solid var(--amber); }
.card::after{ bottom:5px; right:5px; border-bottom:1px solid var(--amber); border-right:1px solid var(--amber); }
.card:hover::before, .card:hover::after{ opacity:1; }
.card-top{ display:flex; align-items:center; justify-content:space-between; }
.card-icon{ width:20px; height:20px; opacity:0.8; }
.tag{
  font-family:'IBM Plex Mono', monospace;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.tag.rare{ color: var(--amber); border-color: var(--amber-dim); }
.tag.common{ color: var(--verdigris); border-color: var(--verdigris); }
.card h3{ font-size: 18px; margin-top:2px; }
.card p{ font-size: 12.5px; color: var(--text-dim); line-height:1.55; }

/* category list (sidebar-style category browser page) */
.cat-header{
  display:flex; align-items:center; gap:14px;
  margin-bottom: 22px;
}
.cat-icon-big{
  width:44px; height:44px;
  border:1px solid var(--border);
  border-radius: var(--radius);
  display:flex; align-items:center; justify-content:center;
  color: var(--amber);
}
.cat-header p{ color: var(--text-dim); font-size: 13px; margin-top:2px; }
/* --- mission en cours (tableau de bord tactique) --- */
.mission-page{
  position:relative;
  background:#05070a; border:1px solid #16303c; border-radius:4px;
  padding:16px; padding-bottom:56px;
  font-family:'IBM Plex Mono', monospace; color:#9fd8d8;
}
.mc-topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid #16303c;
}
.mc-topbar-left{ display:flex; gap:8px; }
.mc-gauge{ width:34px; height:34px; color:#3ec9c0; flex-shrink:0; }
.mc-gauge svg{ width:100%; height:100%; display:block; }
.mc-gauge-needle{ transform-origin:20px 20px; animation: mcNeedleSpin 4s linear infinite; }
.mc-gauge:nth-child(2) .mc-gauge-needle{ animation-duration:6s; animation-direction:reverse; }
.mc-gauge:nth-child(3) .mc-gauge-needle{ animation-duration:3.2s; }
.mc-gauge:nth-child(4) .mc-gauge-needle{ animation-duration:5s; animation-direction:reverse; }
@keyframes mcNeedleSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
.mc-clock{ text-align:center; }
.mc-clock-label{ font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:#5f8a90; margin-bottom:3px; }
.mc-clock-value{ font-size:24px; font-weight:600; color:#eef8f8; letter-spacing:0.02em; min-width:190px; font-variant-numeric:tabular-nums; }
.mc-clock-seg{ display:inline-block; min-width:1.15em; color:#3ec9c0; }
.mc-status-grid{ display:grid; grid-template-columns:repeat(8, 8px); gap:3px; }
.mc-status-cell{ width:8px; height:8px; background:#2a1006; border:1px solid #6b2f16; }
.mc-status-cell.on{ background:#ff8a3d; box-shadow:0 0 6px rgba(255,138,61,0.8); }

.mc-toolbar{ display:flex; flex-wrap:wrap; gap:20px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid #16303c; }
.mc-toolbar-group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.mc-toolbar-label{ font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:#5f8a90; margin-right:2px; }
.mc-alert-btn, .mc-filter-btn, .mc-icon-btn, .mc-log-toggle, .mc-btn-recalibrate{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase;

}
.mc-alert-btn:hover, .mc-filter-btn:hover, .mc-icon-btn:hover, .mc-log-toggle:hover, .mc-btn-recalibrate:hover{

}
.mc-alert-btn.active, .mc-filter-btn.active{ background:#123c3a; border-color:#3ec9c0; color:#eef8f8; }
.mc-alert-btn.alert-yellow.active{ background:#4a3a12; border-color:#ffcf3d; color:#fff3d0; }
.mc-alert-btn.alert-red.active{ background:#4a1712; border-color:#ff5a3d; color:#ffd9d0; }
.mc-icon-btn{ width:26px; height:26px; padding:0; display:inline-flex; align-items:center; justify-content:center; font-size:13px; }
.mc-btn-recalibrate{ display:block; width:100%; margin-top:10px; text-align:center; }

.mission-page[data-alert="yellow"] .mc-radar-panel{ border-color:#ffcf3d; }
.mission-page[data-alert="yellow"] .mc-map-scanline{ background: linear-gradient(180deg, transparent, rgba(255,207,61,0.4), transparent); }
.mission-page[data-alert="red"] .mc-radar-panel{ border-color:#ff5a3d; }
.mission-page[data-alert="red"] .mc-map-scanline{ background: linear-gradient(180deg, transparent, rgba(255,90,61,0.45), transparent); }
.mission-page.mc-flash{ animation: mcFlash .5s ease; }
@keyframes mcFlash{ 0%{ box-shadow: inset 0 0 0 2px rgba(62,201,192,0.85); } 100%{ box-shadow: inset 0 0 0 2px rgba(62,201,192,0); } }

.mc-radar-stage{ transition: transform .2s ease; }

.mc-log-panel{ background:#081821; border:1px solid #16303c; border-radius:4px; padding:12px; margin-bottom:14px; }
.mc-log-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#3ec9c0; }
.mc-log-feed{ max-height:130px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; font-size:10.5px; color:#8fd0c8; }
.mc-log-line{ opacity:0; animation: dossierLineIn .3s ease forwards; }

.mc-main-row{ display:grid; grid-template-columns: 190px 1fr 190px; gap:12px; margin-bottom:14px; }
@media (max-width:900px){ .mc-main-row{ grid-template-columns:1fr; } }

.mc-panel{ background:#081821; border:1px solid #16303c; border-radius:4px; padding:12px; }
.mc-panel-title{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#3ec9c0; margin-bottom:10px; }
.mc-side-list{ display:flex; flex-direction:column; gap:12px; }
.mc-side-row{ display:flex; flex-direction:column; gap:4px; }
.mc-side-k{ font-size:9.5px; color:#5f8a90; letter-spacing:0.08em; }
.mc-side-bar{ height:4px; background:#0f2530; border:1px solid #1c3a4a; overflow:hidden; }
.mc-side-bar-fill{ height:100%; background: linear-gradient(90deg,#1f5f5c,#3ec9c0); }
.mc-wireframe{ width:100%; aspect-ratio:1; color:#8fd0d8; margin:4px 0 12px; opacity:.85; }
.mc-wireframe svg{ width:100%; height:100%; display:block; animation: mcWireSpin 9s linear infinite; }
@keyframes mcWireSpin{ from{ transform:rotate(0deg) scaleX(1); } 50%{ transform:rotate(180deg) scaleX(0.6); } to{ transform:rotate(360deg) scaleX(1); } }

.mc-radar-panel{
  background: radial-gradient(ellipse at 50% 32%, #5a1018, #26080e 72%);
  border:1px solid #6b1f24; position:relative; overflow:hidden;
}
.mc-radar-label{
  font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#ff8a3d;
  margin-bottom:8px; text-align:center; display:flex; flex-direction:column; gap:2px;
}
.mc-radar-sub{ font-size:8.5px; letter-spacing:0.1em; color:rgba(255,138,61,0.6); text-transform:none; }
.mc-radar-stage{ position:relative; width:100%; aspect-ratio:16/9; max-height:280px; margin:0 auto; overflow:hidden; border-radius:2px; }
.mc-radar-grid{
  position:absolute; inset:0;
  background-image: linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
  background-size:24px 24px;
}
.mc-continent-shape{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.mc-continent-shape path{
  fill: rgba(62,201,192,0.07);
  stroke: rgba(62,201,192,0.5);
  stroke-width:0.6;
  stroke-dasharray: 2 1.4;
  animation: mcContinentGlow 4s ease-in-out infinite, mcContinentDash 12s linear infinite;
}
@keyframes mcContinentGlow{ 0%,100%{ filter: drop-shadow(0 0 2px rgba(62,201,192,0.3)); } 50%{ filter: drop-shadow(0 0 6px rgba(62,201,192,0.6)); } }
@keyframes mcContinentDash{ to{ stroke-dashoffset:-40; } }
.mission-page[data-alert="yellow"] .mc-continent-shape path{ stroke: rgba(255,207,61,0.5); }
.mission-page[data-alert="red"] .mc-continent-shape path{ stroke: rgba(255,90,61,0.55); }
.mc-map-terrain{ position:absolute; inset:0; pointer-events:none; }
.mc-terrain-blob{
  position:absolute; width:26%; height:46%; transform:translate(-50%,-50%);
  background: radial-gradient(ellipse at center, rgba(var(--tclr),0.4), rgba(var(--tclr),0.08) 60%, transparent 78%);
  filter: blur(2px);
  animation: mcTerrainPulse 6s ease-in-out infinite;
}
.mc-terrain-blob:nth-child(2){ animation-delay:-1.5s; }
.mc-terrain-blob:nth-child(3){ animation-delay:-3s; }
.mc-terrain-blob:nth-child(4){ animation-delay:-4.5s; }
@keyframes mcTerrainPulse{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }
.mc-map-routes{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.mc-route-line{ fill:none; stroke:#3ec9c0; stroke-width:0.35; stroke-dasharray:1.6 1.4; opacity:.55; animation: mcRouteFlow 2.4s linear infinite; }
@keyframes mcRouteFlow{ to{ stroke-dashoffset:-6; } }
.mc-map-scanline{
  position:absolute; left:0; right:0; height:16%;
  background: linear-gradient(180deg, transparent, rgba(62,201,192,0.4), transparent);
  animation: mcScanY 3.6s linear infinite; pointer-events:none;
}
@keyframes mcScanY{ from{ top:-20%; } to{ top:104%; } }
.mc-map-hq{
  position:absolute; width:10px; height:10px; transform:translate(-50%,-50%); border-radius:50%;
  background:#ff8a3d; box-shadow:0 0 10px rgba(255,138,61,0.8); animation: mcBlipPulse 2s ease-in-out infinite;
}
.mc-map-hq-label{
  position:absolute; top:12px; left:50%; transform:translateX(-50%); white-space:nowrap;
  font-size:8px; letter-spacing:0.08em; color:#ff8a3d;
}
.mission-page[data-alert="yellow"] .mc-map-hq{ background:#ffcf3d; box-shadow:0 0 10px rgba(255,207,61,0.8); }
.mission-page[data-alert="red"] .mc-map-hq{ background:#ff5a3d; }
.mc-graticule{ position:absolute; inset:6px; pointer-events:none; }
.mc-grat{ position:absolute; font-family:'IBM Plex Mono', monospace; font-size:8px; letter-spacing:0.04em; color:rgba(159,216,216,0.5); }
.mc-grat-tl{ top:0; left:0; } .mc-grat-tr{ top:0; right:0; } .mc-grat-bl{ bottom:0; left:0; } .mc-grat-br{ bottom:0; right:0; }
.mc-blip{
  position:absolute; transform:translate(-50%,-50%); background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:0;
}
.mc-blip-dot{
  width:8px; height:8px; border-radius:50%; background:#3ec9c0;
  box-shadow:0 0 8px rgba(62,201,192,0.7); animation: mcBlipPulse 2s ease-in-out infinite;
}
@keyframes mcBlipPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.4); opacity:.6; } }
.mc-blip-label{
  font-size:8.5px; letter-spacing:0.05em; text-transform:uppercase; color:#eef8f8;
  background:rgba(5,7,10,0.75); padding:1px 4px; white-space:nowrap; opacity:0; transition:opacity .15s ease;
}
.mc-blip:hover .mc-blip-label{ opacity:1; }
.mc-readouts{ display:flex; flex-wrap:wrap; justify-content:center; gap:18px; margin-top:12px; }
.mc-readout{ display:flex; align-items:baseline; gap:4px; }
.mc-readout-num{ font-size:19px; font-weight:600; color:#eef8f8; }
.mc-readout-unit{ font-size:9.5px; color:#5f8a90; }
.mc-readout-label{ font-size:9px; color:#ff8a3d; letter-spacing:0.1em; margin-right:2px; }
.mc-readout-accent .mc-readout-num{ color:#3ec9c0; }

.mc-bottom{ background:#081821; border:1px solid #16303c; border-radius:4px; padding:14px; }
.mc-control-title{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#3ec9c0; margin-bottom:10px; }
.mc-control-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
@media (max-width:760px){ .mc-control-grid{ grid-template-columns:1fr; } }
.mc-control-panel{ border:1px solid #16303c; padding:10px; background:#050f15; }
.mc-graph{ width:100%; height:40px; color:#3ec9c0; margin-bottom:8px; display:block; }
.mc-control-rows{ display:flex; flex-direction:column; gap:7px; }
.mc-control-row{ display:flex; justify-content:space-between; align-items:center; font-size:10px; letter-spacing:0.06em; color:#9fd8d8; }
.mc-toggle{ width:26px; height:14px; border:1px solid #1c3a4a; border-radius:8px; position:relative; cursor:pointer; flex-shrink:0; }
.mc-toggle::after{
  content:""; position:absolute; top:1px; left:1px; width:10px; height:10px; border-radius:50%;
  background:#5f8a90; transition: left .15s ease, background .15s ease;
}
.mc-toggle.on{ border-color:#3ec9c0; }
.mc-toggle.on::after{ left:13px; background:#3ec9c0; box-shadow:0 0 6px rgba(62,201,192,0.7); }

.mc-corner{ position:absolute; bottom:12px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.mc-corner-left{ left:14px; }
.mc-corner-right{ right:14px; }
.mc-mini-radar{ width:40px; height:40px; border-radius:50%; border:1px solid rgba(62,201,192,0.4); position:relative; overflow:hidden; }
.mc-mini-radar::before{
  content:""; position:absolute; inset:0;
  background: conic-gradient(from 0deg, rgba(62,201,192,0.6), transparent 20%);
  animation: mcSweep 2.4s linear infinite;
}
.mc-corner-coord{ font-size:10px; color:#5f8a90; }

.mc-popover{
  position:absolute; z-index:400; width:240px;
  background:#0a1b26; border:1px solid #3ec9c0; border-radius:4px; padding:10px 12px;
  opacity:0; transform:translateY(-6px); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
}
.mc-popover.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
.mc-pop-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:#eef8f8; letter-spacing:0.06em; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px; }
.mc-pop-status{ color:#ff8a3d; font-size:9px; }
.mc-pop-desc{ font-size:11.5px; line-height:1.5; color:#9fd8d8; }

@media (max-width:760px){
  .mc-topbar{ flex-wrap:wrap; row-gap:10px; }
  .mc-corner{ position:static; }
  .mission-page{ padding-bottom:16px; }
}

/* --- chronologie du monde (frise historique) --- */
.chrono-boot{
  max-width: 620px; margin: 40px auto; padding: 32px 34px;
  border: 1px solid #1f5f5c; background: #070a0a;
  position: relative; overflow:hidden;
  box-shadow: 0 0 34px rgba(62,201,192,0.15);
}
.chrono-boot::before{
  content:"";
  position:absolute; inset:0; pointer-events:none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
}
.chrono-boot-title{
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px; letter-spacing:0.14em; text-transform:uppercase; text-align:center;
  color:#6fe0d8; margin-bottom:24px;
}
.chrono-boot-log{
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px; line-height:2;
  color:#8fd0c8;
  min-height: 130px;
  margin-bottom: 20px;
}
.chrono-boot-line{ opacity:0; animation: dossierLineIn .25s ease forwards; }
.chrono-boot-bar{ height:6px; background: var(--surface-2); border:1px solid var(--border); overflow:hidden; margin-bottom: 8px; }
.chrono-boot-bar-fill{ height:100%; width:0%; background: linear-gradient(90deg, #1f5f5c, #3ec9c0); transition: width .25s ease; }
.chrono-boot-pct{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color: var(--text-dim); text-align:right; }

.chrono-page{ max-width:1180px; margin:0 auto; }
.chrono-epigraph{
  text-align:center; max-width:560px; margin:6px auto 18px;
  font-family:'Cormorant Garamond', serif; font-style:italic; color: var(--text-dim);
}
.chrono-epigraph p{ font-size:16px; color:#d8e6e6; line-height:1.5; }
.chrono-epigraph span{ display:block; margin-top:8px; font-size:11.5px; font-style:normal; letter-spacing:0.06em; text-transform:uppercase; }
.chrono-title{
  text-align:center; font-family:'Cinzel', serif; font-size:26px; letter-spacing:0.04em;
  color:#eaf6f6; margin: 4px 0 26px;
}
.chrono-legend{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:40px; }

.chrono-tag{
  --tagclr: #4ecdd9;
  display:inline-flex; align-items:center; gap:6px;
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  color: var(--tagclr); background: rgba(0,0,0,0.3);
  border:1px solid var(--tagclr); border-radius:20px;
  padding:4px 9px; cursor:pointer;
  transition: background .2s ease, transform .15s ease;
}
.chrono-tag:hover{ background: color-mix(in srgb, var(--tagclr) 18%, transparent); transform: translateY(-1px); }
.chrono-tag-filled{ background: color-mix(in srgb, var(--tagclr) 22%, #0a0a0c); color:#f5f2ea; }
.chrono-tag-i{
  display:inline-flex; align-items:center; justify-content:center;
  width:12px; height:12px; border-radius:50%; border:1px solid currentColor;
  font-size:8px; font-style:italic; font-family:'EB Garamond', serif; opacity:.8;
}

.chrono-timeline{ position:relative; padding:10px 0 20px; }
.chrono-line{
  position:absolute; left:50%; top:0; bottom:0; width:2px;
  transform:translateX(-50%) scaleY(0); transform-origin:top;
  background: linear-gradient(180deg, transparent, #3ec9c0aa 6%, #3ec9c0aa 94%, transparent);
  box-shadow: 0 0 12px rgba(62,201,192,0.5);
}
.chrono-row{
  position:relative; display:grid; grid-template-columns: 1fr 32px 1fr; column-gap:26px;
  margin-bottom:30px;
  opacity:0; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
}
.chrono-row.chrono-left{ transform: translateX(-22px); }
.chrono-row.chrono-right{ transform: translateX(22px); }
.chrono-row.in-view{ opacity:1; transform:none; }
.chrono-dot{
  grid-column:2; grid-row:1; justify-self:center; margin-top:16px;
  width:12px; height:12px; border-radius:50%;
  background:#3ec9c0; box-shadow:0 0 0 4px rgba(62,201,192,0.18);
  animation: chronoPulse 2.6s ease-in-out infinite;
}
@keyframes chronoPulse{
  0%,100%{ box-shadow:0 0 0 4px rgba(62,201,192,0.18); }
  50%{ box-shadow:0 0 0 8px rgba(62,201,192,0.32); }
}
.chrono-card{

.chrono-right .chrono-card::after{ left:-26px; }
.chrono-card:hover{ border-color:#3ec9c066; }
.chrono-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }

.chrono-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.chrono-card-title{ font-family:'Cinzel', serif; font-size:16.5px; color:#f0ebdc; margin-bottom:2px; }
.chrono-body{

}
.chrono-body p{ font-size:13.5px; line-height:1.6; color: var(--text); margin-top:10px; }
.chrono-body h3{

.chrono-quote{

.chrono-toggle{

.chrono-actions{ display:flex; gap:8px; margin-top:12px; }

.chrono-tag-checks{ display:flex; flex-wrap:wrap; gap:10px 16px; }
.chrono-tag-check{

}
.chrono-tag-check input{ cursor:pointer; }

.write-linked-checks{
  display:flex; flex-wrap:wrap; gap:8px 16px; max-height:160px; overflow-y:auto;

}

  display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim);

}

.chrono-tag-popover{
  --tagclr: #3ec9c0;

.chrono-pop-label{

@media (max-width:760px){

  .chrono-line{ left:12px; }
  .chrono-dot{ grid-column:1; margin-top:16px; }
  .chrono-left .chrono-card, .chrono-right .chrono-card{ grid-column:2; justify-self:stretch; text-align:left; }
  .chrono-left .chrono-card::after, .chrono-right .chrono-card::after{ left:-14px; right:auto; width:14px; }

/* --- article page --- */
.article{

.article-body{ padding: 26px 30px; display:grid; grid-template-columns: minmax(0,74ch) minmax(260px,460px); gap: 30px; }
@media (max-width: 700px){ .article-body{ grid-template-columns: 1fr; } }
.article-body h3{ font-size:15px; margin: 18px 0 8px; color: var(--verdigris); text-transform:uppercase; letter-spacing:0.06em; font-family:'EB Garamond'; font-style:italic; font-weight:600; }
.article-body h3:first-child{ margin-top:0; }
.article-body p{ font-size: 13.8px; line-height: 1.8; color: var(--text); margin-bottom: 10px; }
.entry-side{ display:flex; flex-direction:column; gap:16px; }
.entry-gallery{ display:flex; flex-direction:column; gap:14px; }
.entry-gallery-item{ margin:0; }
.entry-gallery-item img{

}
.entry-linked{ display:flex; gap:10px; margin-bottom:14px; }
.entry-linked-avatar{

}
.entry-side-heading{

.entry-specialite h3:first-child{ margin-top:0; }
.infobox{

.infobox::before, .infobox::after,

/* --- fiche personnage façon "profil d'opérateur" --- */
.op-page{ display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); }
.op-rail{
  width:66px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;
  padding:10px 0; gap:8px; background:var(--surface-2); border-right:1px solid var(--border);
}
.op-rail-nav{
  background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:11px; padding:4px;
  transition:color .15s ease;
}
.op-rail-nav:hover{ color:var(--amber); }
.op-rail-list{
  flex:1; width:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:4px 0; scrollbar-width:thin;
}
.op-rail-avatar{
  width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0; cursor:pointer;
  background:var(--surface); border:2px solid transparent; padding:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel', serif; font-size:15px; color:var(--text-dim);
  transition:border-color .15s ease;
}
.op-rail-avatar:hover{ border-color:var(--amber-dim); }
.op-rail-avatar.active{ border-color:var(--amber); }
.op-rail-avatar img{ width:100%; height:100%; object-fit:cover; }
.op-rail-all{
  background:none; border:1px solid var(--border); border-radius:var(--radius); color:var(--text-dim);
  cursor:pointer; font-size:13px; padding:6px 8px; margin-top:4px;
  transition: color .15s ease, border-color .15s ease;
}
.op-rail-all:hover{ color:var(--amber); border-color:var(--amber-dim); }

.op-main{ flex:1; min-width:0; }
.op-hero{
  position:relative; height:300px; overflow:hidden; background:var(--surface-2);
  border-bottom:1px solid var(--border);
}
.op-hero-bgtext{
  position:absolute; inset:0; display:flex; align-items:center;
  font-family:'Cinzel', serif; font-weight:700; letter-spacing:0.02em;
  font-size:clamp(60px, 12vw, 150px); line-height:1; white-space:nowrap;
  color: rgba(var(--fclr), 0.14); padding-left:24px; user-select:none;
}
.op-hero-blob{
  position:absolute; top:-20%; right:6%; width:55%; height:140%;
  background: rgba(var(--fclr), 0.22); filter:blur(46px); border-radius:50%;
  pointer-events:none;
}
.op-hero-img{
  position:absolute; right:4%; bottom:0; height:100%; max-width:56%;
  object-fit:contain; object-position:bottom center;
  filter: drop-shadow(0 18px 26px rgba(0,0,0,0.55));
}
@media (max-width:700px){
  .op-hero{ height:220px; }
  .op-hero-img{ max-width:70%; right:0; }
}
.op-name-row{ padding:18px 24px 0; }
.op-name{ font-family:'Cinzel', serif; font-size:28px; letter-spacing:0.02em; color:#f0ebdc; margin-top:8px; }
.op-tagline{ color: var(--text-dim); font-size:13.5px; margin-top:4px; }
.op-facts-bar{
  display:flex; gap:28px; flex-wrap:wrap;
  padding:14px 24px; margin-top:14px;
  border-top:1px solid var(--border); border-bottom:1px solid var(--border);
}
.op-fact{ display:flex; flex-direction:column; gap:2px; }
.op-fact-k{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); }
.op-fact-v{ font-size:13px; color:var(--text); font-weight:600; }
.op-quote{ margin:16px 24px 0; }
.op-history-btn{ display:inline-block; margin:16px 24px 0; }
.op-article-body{ padding-top:20px; }

.op-hero{ opacity:0; transition: opacity .5s ease; overflow:hidden; }
.op-page.in .op-hero{ opacity:1; }
.op-hero-img{ transition: transform .25s ease-out; }
.op-page:hover .op-hero-img{ transform: scale(1.03); }
.op-hero-blob{ transition: transform .3s ease-out; }
.op-hero-bgtext{ animation: opBgDrift 8s ease-in-out infinite; }
@keyframes opBgDrift{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(10px); } }

.op-hero-shard{
  position:absolute; top:-20%; height:140%; width:16%;
  background: rgba(var(--fclr), 0.16);
  transform: skewX(-12deg) translateX(160%);
  transition: transform .65s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}
.op-hero-shard-1{ right:26%; }
.op-hero-shard-2{ right:10%; width:9%; background: rgba(var(--fclr), 0.09); transition-delay:.08s; }
.op-page.in .op-hero-shard{ transform: skewX(-12deg) translateX(0); }

.op-hero-particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.op-particle{
  position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
  background: rgb(var(--fclr)); box-shadow:0 0 6px rgba(var(--fclr),0.8);
  animation-name: opParticleDrift; animation-timing-function:linear; animation-iteration-count:infinite;
}
@keyframes opParticleDrift{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  10%{ opacity:.9; }
  85%{ opacity:.7; }
  100%{ transform:translateY(-260px) translateX(14px); opacity:0; }
}

.op-hero-scan{
  position:absolute; left:0; right:0; top:-25%; height:20%;
  background: linear-gradient(180deg, transparent, rgba(var(--fclr),0.3), transparent);
  animation: opScanY 5s linear infinite;
  pointer-events:none;
}
@keyframes opScanY{ from{ top:-25%; } to{ top:105%; } }

.op-hero-corners{ position:absolute; inset:14px; pointer-events:none; }
.op-corner{ position:absolute; width:16px; height:16px; border-color: rgb(var(--fclr)); animation: opCornerPulse 2.4s ease-in-out infinite; }
.op-corner-tl{ top:0; left:0; border-top:2px solid; border-left:2px solid; }
.op-corner-tr{ top:0; right:0; border-top:2px solid; border-right:2px solid; }
.op-corner-bl{ bottom:0; left:0; border-bottom:2px solid; border-left:2px solid; }
.op-corner-br{ bottom:0; right:0; border-bottom:2px solid; border-right:2px solid; }
@keyframes opCornerPulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

.op-name-row, .op-facts-bar, .op-quote, .op-history-btn, .op-article-body{
  opacity:0; transform:translateY(14px);
  transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
}
.op-page.in .op-name-row{ transition-delay:.05s; }
.op-page.in .op-facts-bar{ transition-delay:.15s; }
.op-page.in .op-quote{ transition-delay:.25s; }
.op-page.in .op-history-btn{ transition-delay:.3s; }
.op-page.in .op-article-body{ transition-delay:.35s; }
.op-page.in .op-name-row,
.op-page.in .op-facts-bar,
.op-page.in .op-quote,
.op-page.in .op-history-btn,
.op-page.in .op-article-body{ opacity:1; transform:translateY(0); }

.op-rail-avatar{ transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
.op-rail-avatar:hover{ transform: scale(1.1); box-shadow:0 0 10px rgba(196,201,209,0.4); }
.op-rail-avatar.active{ animation: opAvatarPulse 2.2s ease-in-out infinite; }
@keyframes opAvatarPulse{
  0%,100%{ box-shadow:0 0 6px rgba(196,201,209,0.35); }
  50%{ box-shadow:0 0 14px rgba(196,201,209,0.7); }
}

/* --- roster de personnages (façon Wuthering Waves) --- */

/* --- écran de révélation d'un personnage (façon HUD Persona 5) --- */
.char-reveal-overlay{
  --p5-red:#e21221; --p5-red-dark:#a30a17; --p5-black:#0a0a0a; --p5-white:#f5f2ea;
  position: fixed; inset:0; z-index:9600;
  background: var(--p5-black);
  overflow:hidden;
  opacity:0; pointer-events:none; cursor:pointer;
  transition: opacity .22s steps(3,end);
}
.char-reveal-overlay.open{ opacity:1; pointer-events:auto; }
.cr-halftone{
  position:absolute; inset:-10%; z-index:0; pointer-events:none;
  background-image: radial-gradient(rgba(226,18,33,0.5) 1.6px, transparent 1.7px);
  background-size: 9px 9px;
  opacity:0; mix-blend-mode: screen;
  transition: opacity .5s ease .1s;
}
.char-reveal-overlay.open .cr-halftone{ opacity:.35; }
.cr-slash{
  position:absolute; z-index:1; pointer-events:none;
  background: var(--p5-red);
  box-shadow: 0 0 0 6px var(--p5-black) inset;
}
.cr-slash-1{
  left:-15%; right:-15%; top:38%; height:26%;
  clip-path: polygon(0 22%, 100% 0, 100% 78%, 0% 100%);
  transform: translateX(-115%) skewY(-4deg);
  transition: transform .5s cubic-bezier(.65,0,.35,1);
}
.cr-slash-2{
  position:absolute; z-index:1; pointer-events:none;
  left:-15%; right:-15%; top:37%; height:4px;
  background: var(--p5-white);
  transform: translateX(115%);
  transition: transform .45s cubic-bezier(.65,0,.35,1) .06s;
}
.char-reveal-overlay.open .cr-slash-1{ transform: translateX(0) skewY(-4deg); }
.char-reveal-overlay.open .cr-slash-2{ transform: translateX(0); }
.cr-bgword{
  position:absolute; right:-3%; top:50%; z-index:1;
  transform: translate(90px,-50%) skewX(-8deg);
  font-family:'Anton', 'Cinzel', sans-serif; font-weight:400;
  font-size: clamp(70px, 18vw, 240px);
  line-height:1; white-space:nowrap; letter-spacing:0.01em; text-transform:uppercase;
  color: var(--p5-black);
  -webkit-text-stroke: 2px rgba(245,242,234,0.14);
  opacity:0; user-select:none; pointer-events:none;
  transition: transform .55s cubic-bezier(.65,0,.35,1) .05s, opacity .3s ease .05s;
}
.char-reveal-overlay.open .cr-bgword{ transform: translate(0,-50%) skewX(-8deg); opacity:1; }
.cr-portrait-wrap{
  position:absolute; right:4%; bottom:0; top:0; z-index:2;
  display:flex; align-items:flex-end; justify-content:center;
  transform: translateY(70px); opacity:0;
  transition: transform .5s cubic-bezier(.65,0,.35,1) .16s, opacity .35s ease .16s;
}
.char-reveal-overlay.open .cr-portrait-wrap{ transform: translateY(0); opacity:1; }
.cr-portrait{
  max-height:92%; max-width:min(46vw,540px); width:auto; object-fit:contain;
  clip-path: polygon(6% 0, 100% 0, 100% 100%, 0 100%);
  filter: drop-shadow(9px 0 0 var(--p5-black)) drop-shadow(-9px 0 0 var(--p5-black)) drop-shadow(0 12px 0 var(--p5-black));
}
.cr-vignette{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(100deg, rgba(10,10,10,0.97) 0%, rgba(10,10,10,0.65) 34%, rgba(10,10,10,0.12) 60%, transparent 76%),
    linear-gradient(0deg, rgba(10,10,10,0.92) 0%, transparent 42%);
}
.cr-topbar{
  position:absolute; top:24px; left:28px; right:28px; z-index:3;
  display:flex; justify-content:space-between; align-items:center;
  font-family:'Anton', sans-serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
  opacity:0; transform: translateY(-10px);
  transition: transform .35s cubic-bezier(.65,0,.35,1) .1s, opacity .3s ease .1s;
}
.char-reveal-overlay.open .cr-topbar{ opacity:1; transform: translateY(0); }
.cr-topbar-left{ display:flex; align-items:center; gap:8px; color: var(--p5-white); }
.cr-topbar-left svg{ color: var(--p5-red); }
.cr-topbar-right{
  color: var(--p5-black); background: var(--p5-red);
  padding: 3px 12px; clip-path: polygon(10% 0,100% 0,90% 100%,0% 100%);
}
.cr-info{ position:absolute; left:0; bottom:64px; right:40px; max-width:640px; z-index:3; }
.cr-eyebrow{
  display:inline-block;
  font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
  color: var(--p5-white); background: var(--p5-black);

.cr-title{

  opacity:0;
  transition: opacity .2s ease .5s;
}

.cr-hint{
  position:absolute; right:28px; bottom:22px; z-index:3;

@keyframes crHintPulse{ 0%,100%{ color: var(--p5-white); } 50%{ color: var(--p5-red); } }
@media (max-width:760px){

/* --- livre d'histoire (page verrouillée par un code) --- */
.story-book-overlay{

  transition: opacity .3s ease;
}

.story-book-backdrop{ position:absolute; inset:0; background: rgba(4,3,2,0.9); }
.story-book{
  position:relative; z-index:1;
  width: 460px; max-width:92%;
  min-height: 320px;
  padding: 36px 40px;
  border-radius: 4px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(196,201,209,0.06), transparent 60%),
    linear-gradient(175deg, #241c14 0%, #17120c 55%, #0e0b07 100%);

  20%{ transform: perspective(1600px) rotateY(0deg) translateX(-8px); }
  40%{ transform: perspective(1600px) rotateY(0deg) translateX(8px); }

}

.story-book-inner{ position:relative; perspective: 1600px; }
.story-book-cover{

  transform-origin: left center;
  transform: rotateY(0deg);
  backface-visibility: hidden;
  border-radius: inherit;
  background:
    radial-gradient(ellipse at 50% 28%, rgba(196,201,209,0.07), transparent 60%),
