  border-radius:2px;
  pointer-events:none;
}
.story-book-cover-emblem{
  color: rgba(196,201,209,0.55);
  font-family:'Cinzel', serif; font-size:13px; letter-spacing:0.3em; text-transform:uppercase;
}
.story-book-pages{ position:relative; perspective: 1400px; }
.story-page-content{ position:relative; }
.story-leaves{ position:absolute; inset:0; pointer-events:none; }
.story-leaf{
  position:absolute; inset:0;
  transform-origin: left center;
  transform: rotateY(0deg);
  backface-visibility: hidden;
  border-radius: inherit;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px),
    linear-gradient(100deg, #2b2219 0%, #1c150f 55%, #110c08 100%);
  box-shadow: inset -12px 0 18px rgba(0,0,0,0.5), 2px 0 8px rgba(0,0,0,0.4);
  transition: transform .56s cubic-bezier(.4,.1,.2,1);
}
.story-leaf.flipped{ transform: rotateY(-170deg); }
.story-page{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; }
.story-seal{ font-size:38px; opacity:0.85; filter: drop-shadow(0 0 10px rgba(196,201,209,0.3)); }
.story-title{ font-family:'Cinzel', serif; font-size:20px; color:#f0ebdc; }
.story-desc{ color: var(--text-dim); font-size:13px; max-width:34ch; line-height:1.6; }
.story-code-row{ display:flex; gap:10px; margin-top:6px; align-items:center; }
.story-code-input{
  width:140px; text-align:center; letter-spacing:0.3em;
  background: rgba(0,0,0,0.35); border:1px solid #3a2f22; border-radius:3px;
  color: var(--text); font-family:'IBM Plex Mono', monospace; font-size:15px;
  padding: 9px 10px;
}
.story-code-input:focus{ outline:none; border-color: var(--amber-dim); }
.story-error{ color:#c98a7a; font-size:12px; opacity:0; transition: opacity .2s ease; height:14px; }
.story-error.show{ opacity:1; }
.story-page-chapter{ align-items:flex-start; text-align:left; }
.story-chapter-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color: var(--verdigris); }
.story-chapter-title{ font-family:'Cinzel', serif; font-size:24px; color:#f0ebdc; margin-bottom:4px; }
.story-chapter-p{ font-size:13.5px; line-height:1.8; color: var(--text); }

.editnote{
  margin-top: 24px;
  padding: 12px 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text-dim);
  display:flex; align-items:center; gap:8px;
}

/* --- widget "TV" annonçant les actualités (accueil) --- */
.news-tv-dock{
  position:fixed; right:24px; bottom:24px; z-index:500;
  width:56px; height:46px; cursor:pointer;
  color: var(--text-dim);
  transition: color .2s ease, transform .2s ease;
}
.news-tv-dock:hover{ color: var(--amber); transform: translateY(-3px); }
.news-tv-icon{ width:100%; height:100%; display:block; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4)); }
.news-tv-dock::before{
  content:""; position:absolute; left:9px; top:15px; right:9px; bottom:15px;
  background: rgba(196,201,209,0.1);
  animation: newsTvFlicker 3s steps(6) infinite;
  pointer-events:none;
}
@keyframes newsTvFlicker{ 0%,100%{ opacity:.25; } 40%{ opacity:.6; } 60%{ opacity:.35; } }
.news-tv-bubble{
  position:absolute; right:0; bottom:100%; margin-bottom:10px;
  background:#0d0d0f; border:1px solid var(--amber-dim); color:var(--amber);
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  padding:5px 12px; border-radius:3px; white-space:nowrap;
  opacity:0; transform:translateY(6px); pointer-events:none;
  transition: opacity .18s ease, transform .18s ease;
}
.news-tv-bubble::after{
  content:""; position:absolute; top:100%; right:14px;
  border:5px solid transparent; border-top-color:#0d0d0f;
}
.news-tv-dock:hover .news-tv-bubble{ opacity:1; transform:translateY(0); }

/* --- page actualités (flash d'infos) --- */
.news-page{ position:relative; }
.news-intro{
  position:absolute; inset:0; z-index:5; background:#000;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  opacity:1; transition: opacity .5s ease;
}
.news-intro.done{ opacity:0; pointer-events:none; }
.news-static{
  position:absolute; inset:0;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.08) 0px, transparent 1px, transparent 3px);
  opacity:0;
}
.news-intro.play .news-static{ animation: newsStaticFlash .6s steps(2) 1; }
@keyframes newsStaticFlash{ 0%{ opacity:.5; } 50%{ opacity:.15; } 100%{ opacity:0; } }
.news-intro-title{
  font-family:'Cinzel', serif; font-size:clamp(26px, 5vw, 46px); letter-spacing:0.08em; text-transform:uppercase;
  color:#f0ebdc; text-shadow: 0 0 18px rgba(196,201,209,0.5);
  opacity:0; transform:scale(0.7);
}
.news-intro.play .news-intro-title{ animation: newsTitleZoom 1s cubic-bezier(.2,.8,.2,1) .45s forwards; }
@keyframes newsTitleZoom{
  0%{ opacity:0; transform:scale(0.6); }
  55%{ opacity:1; transform:scale(1.06); }
  100%{ opacity:1; transform:scale(1); }
}
.news-content{ min-height:420px; }
.news-header{ text-align:center; margin-bottom:26px; }
.news-live-tag{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.12em;
  color:#e0857c; margin-bottom:10px;
  animation: dossierWarnFlash 1.4s steps(1) infinite;
}
.news-header h1{ font-family:'Cinzel', serif; font-size:26px; color:#f0ebdc; }
.news-sub{ color: var(--text-dim); font-size:13px; margin-top:4px; }
.news-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px;
}
.news-card{
  position:relative; height:280px; overflow:hidden; cursor:pointer;
  background: var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
  transition: border-color .2s ease;
}
.news-card:hover{ border-color: var(--amber-dim); }
.news-card-img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center;
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
}
.news-card:hover .news-card-img{ transform:scale(1.06); }
.news-card::before{
  content:""; position:absolute; inset:0;
  background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.2) 55%, transparent 72%);
}
.news-card-body{ position:absolute; left:0; right:0; bottom:0; padding:14px; }
.news-card-tag{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase;
  color:#e0857c; margin-bottom:4px;
}
.news-card-body h3{ font-family:'Cinzel', serif; font-size:16px; color:#f0ebdc; }
.news-card-body p{ font-size:12px; color: var(--text-dim); margin-top:2px; }
@media (max-width:760px){
  .news-tv-dock{ right:16px; bottom:16px; width:46px; height:38px; }
}

.empty-state{
  text-align:center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state svg{ opacity:0.4; margin-bottom:12px; }

footer.page-foot{
  margin-top: 40px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
}
</style>
</head>
